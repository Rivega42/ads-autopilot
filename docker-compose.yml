services:
  postgres:
    image: postgres:16-alpine
    container_name: ads-autopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ads_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ads_autopilot}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ads} -d ${POSTGRES_DB:-ads_autopilot}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ads-autopilot-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  prisma-studio:
    image: node:22-alpine
    container_name: ads-autopilot-prisma-studio
    profiles: ['tools']
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ads}:${POSTGRES_PASSWORD:-ads_dev}@postgres:5432/${POSTGRES_DB:-ads_autopilot}
    ports:
      - '5555:5555'
    volumes:
      - .:/app
    command:
      [
        'sh',
        '-c',
        'corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma studio --hostname 0.0.0.0 --port 5555',
      ]

volumes:
  pg_data:
  redis_data:
