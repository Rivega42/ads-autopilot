# Прод-стек. Разворачивается на одном VPS: `docker compose -f docker-compose.prod.yml up -d`.
# Переменные читаются из файла .env рядом с этим файлом — см. docs/DEPLOY.md.
#
# Postgres и Redis наружу не публикуются: их порты видны только внутри сети
# compose. Единственная точка входа снаружи — nginx на 80/443.

x-app-env: &app-env
  NODE_ENV: production
  TZ: Europe/Moscow
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379
  # Предохранитель. Снимать осознанно и только после проверки в песочнице:
  # с DRY_RUN=false система начинает писать в живые рекламные кабинеты.
  DRY_RUN: ${DRY_RUN:-true}

x-app-base: &app-base
  image: ${APP_IMAGE:-ghcr.io/rivega42/ads-autopilot:latest}
  restart: unless-stopped
  env_file: [.env]
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction обязателен: BullMQ держит в Redis состояние задач, и вытеснение
    # ключей под нагрузкой молча потеряло бы запланированные прогоны.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Миграции — отдельный одноразовый контейнер, а не шаг внутри api. Пока они
  # шли в api, длинная миграция (backfill, CREATE INDEX без CONCURRENTLY) успевала
  # провалить его healthcheck: api оставался живым, но `up --wait` возвращал
  # ошибку, а worker и bot, ждущие его здоровья, не запускались вовсе.
  migrate:
    <<: *app-base
    restart: 'no'
    healthcheck: { disable: true }
    environment:
      <<: *app-env
      ROLE: migrate
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-base
    environment:
      <<: *app-env
      ROLE: api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app-base
    # HEALTHCHECK образа стучится в HTTP-порт, которого у воркера нет: с ним
    # сервис через минуту становится unhealthy, и `up --wait` в deploy.sh ждёт
    # его до таймаута.
    #
    # Но и снятая проверка не бесплатна: сервис без healthcheck `up --wait` считает
    # готовым в момент создания контейнера. Воркер, падающий на старте (битый .env,
    # недоступный Redis) и крутящийся в рестарт-петле, проходит выкат как «Healthy» —
    # проверено ломанием. Заменить на проверку процесса нельзя честно: она проходит
    # ровно в те секунды, пока процесс жив, то есть в петле срабатывает на каждом
    # витке. Поэтому петлю ловит deploy.sh — по счётчику рестартов, снятому дважды
    # с выдержкой (см. scripts/deploy.sh, DEPLOY_SETTLE_SECONDS).
    healthcheck: { disable: true }
    environment:
      <<: *app-env
      ROLE: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  bot:
    <<: *app-base
    # То же, что у воркера: long polling не слушает HTTP, а петлю рестартов ловит
    # deploy.sh. Для бота она особенно вероятна: неверный или отозванный
    # TELEGRAM_BOT_TOKEN валит getMe на старте, и процесс выходит — но только через
    # тридцать секунд ожидания, так что проверка «процесс жив» не поймала бы это
    # никаким порогом, не привязанным к константе таймаута из кода.
    healthcheck: { disable: true }
    environment:
      <<: *app-env
      ROLE: bot
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: ${WEB_IMAGE:-ghcr.io/rivega42/ads-autopilot-web:latest}
    restart: unless-stopped
    # env_file здесь намеренно нет: дашборд — единственный компонент, который
    # смотрит наружу, и мастер-ключ с токенами площадок ему не нужен. Всё, что он
    # читает, перечислено ниже.
    environment:
      NODE_ENV: production
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      # Дашборд закрыт nginx-ом, но собственная калитка остаётся включённой:
      # доступ в обход прокси не должен открывать расходы клиентов.
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?}
      DASHBOARD_AUTH_MODE: ${DASHBOARD_AUTH_MODE:-}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?}
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on: [api, web]
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  pg_data:
  redis_data:
  certbot_webroot:

networks:
  internal:
