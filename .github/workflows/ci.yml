name: CI

# main в push-триггерах нет намеренно: там этот же воркфлоу вызывает publish.yml
# как reusable (`uses: ./.github/workflows/ci.yml`) — он же гейт публикации. Два
# триггера дали бы два одинаковых прогона на каждый коммит в main. Заодно
# проверки появились на тегах v*, где их не было вовсе: publish на теге тоже
# сначала зовёт этот воркфлоу.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Отменяем только устаревшие прогоны PR. Вызванный из publish.yml прогон —
  # это гейт публикации, и отмена на полпути читалась бы как красный CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Обязательно до typecheck: код импортирует типы из @prisma/client,
      # которых до генерации не существует. DATABASE_URL нужен потому, что
      # prisma.config.ts бросает исключение при его отсутствии; подключения
      # generate не делает, значение может быть любым валидным URL.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ads_autopilot_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # migrate deploy применяет миграции, но клиент не генерирует.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ads_autopilot_test

      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ads_autopilot_test

      - run: pnpm test:unit
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ads_autopilot_test
          REDIS_URL: redis://localhost:6379

  # Дашборд — отдельный пакет workspace: корневой vitest не подхватывает
  # web/lib/**/*.test.ts, а корневой typecheck не знает про JSX. Без этой job'ы
  # правки в web/ не проверялись ничем.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Тесты дашборда тянут значения из @prisma/client (enum ConversionSource),
      # а `test` в отличие от `build` генерацию не запускает.
      - run: pnpm --filter web db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm --filter web test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Сборка Next включает собственный typecheck страниц и генерирует клиент
      # Prisma в свой экземпляр пакета — подключения к базе при этом нет.
      - run: pnpm --filter web build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # Образ ломается иначе, чем тесты: alias'ы `@/`, отсутствие workspace-манифестов
  # и незагенерённый клиент Prisma видны только при реальной сборке.
  #
  # На main и на тегах эта job пропускается: там ровно те же две цели сразу после
  # проверок собирает publish.yml, и второй прогон — это лишние ~10 минут ради
  # образа, который никуда не поедет. На PR и на develop она остаётся
  # единственной проверкой сборки, и права на реестр ей не нужны.
  docker:
    if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Разные scope обязательны: с общим (дефолтным) второй шаг затирает манифест
      # первого, и кеша не будет ни у одного.
      - name: build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
