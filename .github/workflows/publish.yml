name: Publish images

# Публикация образов в GHCR. Триггеров pull_request здесь нет и быть не должно:
# воркфлоу просит packages: write, а запущенный на коде из форка он отдал бы право
# записи в реестр автору любого PR. Проверочная сборка на PR осталась в ci.yml —
# она собирает те же цели с push: false.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  # cancel-in-progress намеренно false: прерванная публикация оставляет в реестре
  # часть тегов (например sha- без latest), и понять, что где лежит, уже нельзя.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Гейт: в реестр не уезжает то, что не прошло проверки.
  #
  # Почему ci.yml вызывается отсюда, а не гейтит через workflow_run: workflow_run
  # не помогает с релизами. Тег v* не входит в ветки-триггеры ci.yml, а расширить
  # их нельзя так, чтобы publish дождался нужного прогона — ссылки на конкретный
  # run у него нет, и на теге гейт либо всегда красный, либо всегда зелёный.
  # Reusable workflow даёт то же самое одним ребром графа и работает одинаково
  # для main и для тегов. Цена — публикация ждёт тесты (~10 минут); это и есть
  # смысл гейта.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ''
          - target: web
            suffix: '-web'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Сначала собираем обе цели без публикации. Если сборка web падает, а app
      # уже опубликован, в реестре расходятся latest бэкенда и дашборда: они
      # поедут с разных коммитов на одну схему БД, и заметить это нечем.
      # Отдельный job publish ниже стартует только когда собрались обе.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          # Scope тот же, что у job docker в ci.yml: кеш, записанный на main,
          # читается прогонами на ветках и PR. Общий scope на две цели брать
          # нельзя — вторая сборка затрёт манифест первой.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ''
          - target: web
            suffix: '-web'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Отдельный PAT не нужен: GITHUB_TOKEN с packages: write пишет в пакеты
          # своего репозитория. Секрет живёт один прогон и не утекает в форки.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          # sha-<коммит> — единственный неподвижный тег, на него откатывается
          # scripts/rollback.sh. latest двигается только по main: на теге v* его
          # обновлять нечем — релиз режется из того же коммита, который main уже
          # опубликовал.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Собирается по кешу предыдущего job'а, то есть это почти чистый push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
